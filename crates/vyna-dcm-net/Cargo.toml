[package]
name = "vyna-dcm-net"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
homepage = "https://github.com/FlostelInfoTech/vynadcm"
authors.workspace = true
repository.workspace = true
description = "VynaDCM networking: DIMSE, associations, SCU/SCP services"
keywords = ["dicom", "dimse", "pacs", "networking"]
categories = ["network-programming", "multimedia"]

[features]
default = ["tls"]
tls = ["tokio-rustls", "rustls", "rustls-pki-types", "webpki-roots"]

[dependencies]
vyna-dcm-core = { path = "../vyna-dcm-core", version = "0.6" }
vyna-dcm-codec = { path = "../vyna-dcm-codec", version = "0.6" }
thiserror.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["fs", "net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
rcgen.workspace = true
