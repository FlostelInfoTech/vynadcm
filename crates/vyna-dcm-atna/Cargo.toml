[package]
name = "vyna-dcm-atna"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
homepage = "https://github.com/FlostelInfoTech/vynadcm"
authors.workspace = true
repository.workspace = true
description = "VynaDCM ATNA audit-trail emission: DICOM audit messages over syslog"
keywords = ["dicom", "atna", "audit", "syslog"]
categories = ["network-programming"]

[features]
default = ["tls"]
tls = ["rustls", "rustls-pki-types", "webpki-roots"]

[dependencies]
vyna-dcm-core = { path = "../vyna-dcm-core", version = "0.6" }
thiserror.workspace = true
base64.workspace = true
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
