[package]
name = "vyna-openjp2"
version = "0.6.1"
edition = "2018"
authors = [
    "Robert G. Jakabosky <rjakabosky+neopallium@neoawareness.com>",
    "FlostelInfoTech",
]
description = "Rust port of OpenJPEG (VynaDCM fork: null-dealloc soundness fix)."
license = "BSD-2-Clause"
repository = "https://github.com/FlostelInfoTech/vynadcm"
homepage = "https://github.com/FlostelInfoTech/vynadcm/tree/main/crates/vyna-openjp2"
documentation = "https://docs.rs/vyna-openjp2"
readme = "README.md"
keywords = ["j2k", "jp2", "jpeg2000", "image", "dicom"]
categories = ["multimedia"]
exclude = ["CMakeLists.txt", "samples/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "vyna_openjp2"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = ["std", "file-io"]
file-io = ["libc"]
jpspec = []
jpwl = []
std = ["log/std"]

[dependencies]
bitflags = "1.3.2"
byteorder = "1.5"
libc = { version = "0.2", optional = true }
log = "0.4.17"
smallvec = "1.13"
sprintf = "0.1.3"
