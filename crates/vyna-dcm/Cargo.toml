[package]
name = "vyna-dcm"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VynaDCM: from-scratch DICOM library for VynaECG and VynaLink"
autobins = false

[features]
default = ["net", "web", "ecg", "cli"]
net = ["vyna-dcm-net"]
web = ["vyna-dcm-web"]
ecg = ["vyna-dcm-ecg"]
cli = ["clap"]

[dependencies]
vyna-dcm-core = { path = "../vyna-dcm-core", version = "0.4" }
vyna-dcm-codec = { path = "../vyna-dcm-codec", version = "0.4" }
vyna-dcm-iod = { path = "../vyna-dcm-iod", version = "0.4" }
vyna-dcm-pdf = { path = "../vyna-dcm-pdf", version = "0.4" }
vyna-dcm-deid = { path = "../vyna-dcm-deid", version = "0.4" }
vyna-dcm-atna = { path = "../vyna-dcm-atna", version = "0.4" }
vyna-dcm-net = { path = "../vyna-dcm-net", version = "0.4", optional = true }
vyna-dcm-web = { path = "../vyna-dcm-web", version = "0.4", optional = true }
vyna-dcm-ecg = { path = "../vyna-dcm-ecg", version = "0.4", optional = true }
thiserror.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process"] }
tracing.workspace = true
clap = { workspace = true, optional = true }

[[bin]]
name = "echoscu"
path = "src/bin/echoscu.rs"
required-features = ["cli", "net"]

[[bin]]
name = "echoscp"
path = "src/bin/echoscp.rs"
required-features = ["cli", "net"]

[[bin]]
name = "storescu"
