[workspace]
resolver = "2"
members = [
    "crates/vyna-dcm-core",
    "crates/vyna-dcm-codec",
    "crates/vyna-dcm-net",
    "crates/vyna-dcm-web",
    "crates/vyna-dcm-ecg",
    "crates/vyna-dcm",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
authors = ["alex.fanshao@flostel.com"]
repository = "https://gitlab.flostel.com/alexshao/VynaDCM"

[workspace.dependencies]
thiserror = "2"
base64 = "0.23"
bytes = "1"
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
# ring (not aws-lc-rs): reqwest 0.13 `rustls-no-provider` brings no crypto
# provider, so our `ring` is the only one process-wide; the web client
# installs it as the rustls default (roots come from the OS store via
# rustls-platform-verifier).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
rcgen = "0.14"

[profile.release]
lto = "thin"
codegen-units = 16
