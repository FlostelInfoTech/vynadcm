[workspace]
resolver = "2"
members = [
    "crates/vyna-openjp2",
    "crates/vyna-dcm-core",
    "crates/vyna-dcm-codec",
    "crates/vyna-dcm-net",
    "crates/vyna-dcm-web",
    "crates/vyna-dcm-ecg",
    "crates/vyna-dcm-iod",
    "crates/vyna-dcm-pdf",
    "crates/vyna-dcm-deid",
    "crates/vyna-dcm-atna",
    "crates/vyna-dcm",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Alex SHAO Fan <alex.shaofan@flostel.com>"]
repository = "https://github.com/FlostelInfoTech/vynadcm"

[workspace.dependencies]
thiserror = "2"
base64 = "0.23"
encoding_rs = "0.8"
bytes = "1"
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
# ring (not aws-lc-rs): reqwest 0.13 `rustls-no-provider` brings no crypto
# provider, so our `ring` is the only one process-wide; the web client
# installs it as the rustls default (roots come from the OS store via
# rustls-platform-verifier).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-platform-verifier = "0.7"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
rcgen = "0.14"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
pure_jpegls = "2"
pure_jpegli = "2"
vyna-openjp2 = { version = "0.6", path = "crates/vyna-openjp2", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 16

# `vyna-openjp2` is our fork of `openjp2` 0.6.1 (null-`dealloc` soundness
# fix, see crates/vyna-openjp2/README.md). It is published to crates.io
# separately (publish it before vyna-dcm-codec).
