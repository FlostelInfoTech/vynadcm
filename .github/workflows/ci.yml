# VynaDCM quality gates (mirrors .gitlab-ci.yml; see NFR-07).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - run: cargo test --workspace --all-targets

  # Every feature combination must build (guards feature-gate drift
  # between the bins and the optional net/web/ecg dependencies).
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - run: cargo check -p vyna-dcm --no-default-features --all-targets
      - run: cargo check -p vyna-dcm --no-default-features --features cli --all-targets
      - run: cargo check -p vyna-dcm --no-default-features --features cli,net --all-targets
      - run: cargo check -p vyna-dcm --no-default-features --features cli,web --all-targets
      - run: cargo check -p vyna-dcm --no-default-features --features cli,ecg --all-targets
      - run: cargo check -p vyna-dcm --no-default-features --features cli,net,web --all-targets
      - run: cargo check -p vyna-dcm-net --no-default-features --all-targets
      - run: cargo check -p vyna-dcm-web --no-default-features --all-targets
      - run: cargo check -p vyna-dcm-atna --no-default-features --all-targets
